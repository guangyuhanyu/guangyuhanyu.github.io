<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn luyện · Guangyu Hanyu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--slate:#435962;--slate-soft:#56707A;--sky-mid:#86A0AA;--maroon:#7C2C20;--maroon-deep:#5C2018;--seal:#CF3D2F;--gold:#AEA56B;--gold-soft:#D8CF9C;--paper:#FBF7EA;--paper-soft:#F1EBD6;--ink:#2B2A22;--ink-soft:#56604F;--ok:#3E7B4F;--bad:#9A3B2E}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink)}
body{background:linear-gradient(180deg,#EEF3F0 0%,#E3ECEA 55%,#D6E2E1 100%) fixed;padding:16px 14px 30px}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto}
.card{position:relative;background:var(--paper);border:1.5px solid var(--gold);border-radius:14px;padding:26px 24px 22px;margin-bottom:16px;box-shadow:0 8px 20px rgba(67,89,98,.14)}
.card::before{content:"";position:absolute;inset:5px;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 74 74'><g transform='translate%280 0%29' fill='none' stroke='%23AEA56B' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M4 70V4H70'/><path d='M14 70V14H70' stroke-width='2'/><path d='M24 24h18v18H24z' stroke-width='2'/><path d='M4 4l20 20' stroke-width='2'/></g></svg>") left top/30px 30px no-repeat,url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 74 74'><g transform='translate%2874 0%29 scale%28-1 1%29' fill='none' stroke='%23AEA56B' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M4 70V4H70'/><path d='M14 70V14H70' stroke-width='2'/><path d='M24 24h18v18H24z' stroke-width='2'/><path d='M4 4l20 20' stroke-width='2'/></g></svg>") right top/30px 30px no-repeat,url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 74 74'><g transform='translate%280 74%29 scale%281 -1%29' fill='none' stroke='%23AEA56B' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M4 70V4H70'/><path d='M14 70V14H70' stroke-width='2'/><path d='M24 24h18v18H24z' stroke-width='2'/><path d='M4 4l20 20' stroke-width='2'/></g></svg>") left bottom/30px 30px no-repeat,url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 74 74'><g transform='translate%2874 74%29 scale%28-1 -1%29' fill='none' stroke='%23AEA56B' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M4 70V4H70'/><path d='M14 70V14H70' stroke-width='2'/><path d='M24 24h18v18H24z' stroke-width='2'/><path d='M4 4l20 20' stroke-width='2'/></g></svg>") right bottom/30px 30px no-repeat}
.card.plain::before{display:none}
.hero0{display:block;width:100%;aspect-ratio:2.13/1;object-fit:cover;object-position:center top;border-radius:14px;border:1.5px solid var(--gold);box-shadow:0 8px 20px rgba(67,89,98,.18);margin-bottom:16px;background:#E3ECEA}
h1,h2{font-family:'Lora',serif;color:var(--slate);margin:0 0 10px;font-size:20px;line-height:1.3}
h2::before{content:"";display:inline-block;width:18px;height:18px;margin-right:8px;vertical-align:-3px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120' fill='none' stroke='%23CF3D2F' stroke-width='6'><circle cx='60' cy='38' r='17'/><circle cx='80.9' cy='53.2' r='17'/><circle cx='72.9' cy='77.8' r='17'/><circle cx='47.1' cy='77.8' r='17'/><circle cx='39.1' cy='53.2' r='17'/><circle cx='60' cy='60' r='8' fill='%2523CF3D2F'/></svg>") center/contain no-repeat}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;color:var(--slate)}
input[type=text],input[type=password],input[type=tel]{width:100%;padding:11px 12px;font-size:16px;border:1.5px solid var(--sky-mid);border-radius:10px;background:#fffdf6;font-family:inherit}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-family:inherit;font-weight:600;cursor:pointer;background:var(--slate);color:#fff}
.btn:hover{background:var(--slate-soft)}
.btn.main{background:var(--maroon)}.btn.main:hover{background:var(--maroon-deep)}
.btn.alt{background:transparent;color:var(--slate);border:1.5px solid var(--slate)}
.btn.small{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--paper-soft);cursor:pointer;font-weight:600;font-size:14px;color:var(--slate)}
.tab.on{background:var(--slate);color:#fff}
.msg{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.note{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.demo{background:#fff4d6;border:1px dashed var(--gold);border-radius:9px;padding:8px 10px;font-size:12px;margin-bottom:10px}
.div{display:block;width:100%;height:18px;margin:6px 0 10px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 40' fill='none' stroke='%23AEA56B' stroke-linecap='round'><path d='M10 20H168M232 20H390' stroke-width='2'/><path d='M168 20l8-8 8 8-8 8zM232 20l-8-8-8 8 8 8z' stroke-width='2'/><rect x='190' y='10' width='20' height='20' fill='%23CF3D2F' stroke='none'/></svg>") center/260px 18px no-repeat}
/* thẻ level = banner riêng */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.lv{position:relative;display:block;width:100%;aspect-ratio:2/1;border:1.5px solid var(--gold);border-radius:12px;padding:0;cursor:pointer;text-align:left;font-family:inherit;overflow:hidden;background:#dfe8e6 center/cover no-repeat;transition:transform .15s,box-shadow .15s}
.lv:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(67,89,98,.22)}
.lv .sc{position:absolute;inset:0}
.lv.scrim .sc{background:linear-gradient(90deg,rgba(38,54,61,.82) 0%,rgba(38,54,61,.45) 55%,rgba(38,54,61,0) 85%)}
.lv.dark .sc{background:linear-gradient(90deg,rgba(32,46,52,.55),rgba(32,46,52,0) 70%)}
.lv.light .sc{background:linear-gradient(90deg,rgba(248,244,230,.88) 0%,rgba(248,244,230,.55) 45%,rgba(248,244,230,0) 75%)}
.lv .tx{position:absolute;left:12px;bottom:26px;right:40%}
.lv b{display:block;font-family:'Lora',serif;font-size:15px;line-height:1.2}
.lv small{display:block;font-size:11.5px;margin-top:3px;opacity:.95}
.lv.scrim b,.lv.dark b{color:#FBF6E9}.lv.scrim small,.lv.dark small{color:#E7EEF0}
.lv.light b{color:var(--slate)}.lv.light small{color:var(--ink-soft)}
.lv .bar{position:absolute;left:12px;right:12px;bottom:10px;height:5px;background:rgba(255,255,255,.55);border-radius:3px;overflow:hidden}
.lv .bar i{display:block;height:100%;background:var(--seal)}
.seal{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:5px;background:var(--seal);box-shadow:0 0 0 1.5px rgba(251,247,234,.9),0 0 0 2.5px var(--gold)}
.seal.sl{background:var(--slate)}
.seal svg{width:100%;height:100%;display:block;fill:none;stroke:#FBF1DC;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seal svg .f{fill:#FBF1DC;stroke:none}
.seal svg *{vector-effect:non-scaling-stroke}
/* dải banner khi đang làm bài */
.strip{position:relative;height:116px;border:1.5px solid var(--gold);border-radius:12px;overflow:hidden;margin-bottom:14px;background:#dfe8e6 center/cover no-repeat}
.strip .sc{position:absolute;inset:0}
.strip.scrim .sc{background:linear-gradient(90deg,rgba(38,54,61,.85),rgba(38,54,61,.35) 60%,rgba(38,54,61,0))}
.strip.dark .sc{background:linear-gradient(90deg,rgba(32,46,52,.55),rgba(32,46,52,0) 70%)}
.strip.light .sc{background:linear-gradient(90deg,rgba(248,244,230,.9),rgba(248,244,230,.5) 50%,rgba(248,244,230,0) 80%)}
.strip .tx{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
.strip b{display:block;font-family:'Lora',serif;font-size:19px}
.strip small{display:block;margin-top:2px;font-size:12px;letter-spacing:.06em}
.strip.scrim b,.strip.dark b{color:#FBF6E9}.strip.scrim small,.strip.dark small{color:var(--gold-soft)}
.strip.light b{color:var(--slate)}.strip.light small{color:var(--ink-soft)}
.strip .seal{width:38px;height:38px;top:50%;transform:translateY(-50%);right:12px}
.ctx{white-space:pre-wrap;background:var(--paper-soft);border-left:4px solid var(--gold);padding:10px 12px;border-radius:6px;font-size:15px;line-height:1.7;margin-bottom:10px;font-family:'Noto Serif SC','Be Vietnam Pro',serif}
.qtxt{white-space:pre-wrap;font-size:18px;line-height:1.65;margin:4px 0 12px;font-family:'Noto Serif SC','Be Vietnam Pro',serif}
.opt{display:block;width:100%;text-align:left;padding:11px 12px;margin:7px 0;border-radius:10px;border:1.5px solid var(--sky-mid);background:#fffdf6;font-size:16px;font-family:'Noto Serif SC','Be Vietnam Pro',serif;cursor:pointer}
.opt:hover{border-color:var(--maroon)}
.opt.ok{background:#e1f1e4;border-color:var(--ok)}
.opt.no{background:#f7dfdb;border-color:var(--bad)}
.opt:disabled{cursor:default}
.tok{display:inline-block;margin:4px;padding:8px 12px;border-radius:9px;background:#fffdf6;border:1.5px solid var(--sky-mid);font-size:17px;cursor:pointer;font-family:'Noto Serif SC',serif}
.tok.used{opacity:.25}
.build{min-height:52px;border:2px dashed var(--sky-mid);border-radius:10px;padding:6px;margin:8px 0;font-size:18px;font-family:'Noto Serif SC',serif}
.fb{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.fb.ok{background:#e1f1e4}.fb.no{background:#f7dfdb}.fb.info{background:var(--paper-soft)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-bottom:10px}
.pybtn{border:1.5px solid var(--maroon);background:transparent;color:var(--maroon-deep);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
body.nopy .py{display:none}
.ins{display:flex;gap:9px;align-items:baseline;margin:0 0 11px;padding:8px 11px;border-radius:9px;background:#F4EBD4;border:1px solid var(--gold);font-size:14px;line-height:1.6;color:var(--ink)}
.ins b{flex:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--maroon-deep)}
ruby{ruby-align:center;ruby-position:over;margin:0 1px}
rt{font-size:max(.48em,9.5px);padding:0 1px;font-weight:500;line-height:1.1;color:var(--maroon-deep);font-family:'Be Vietnam Pro',sans-serif;letter-spacing:0}
body.nopy rt{display:none}
.rbm .qtxt{line-height:2.1}.rbm .ctx{line-height:2.2}.rbm .opt{line-height:2}.rbm .tok{line-height:1.9}
.ansin{display:block;width:100%;box-sizing:border-box;padding:12px 13px;font-size:19px;border:2px solid var(--sky-mid);border-radius:10px;background:#fffdf6;font-family:'Noto Serif SC','Be Vietnam Pro',serif;color:var(--ink)}
.ansin:focus{outline:none;border-color:var(--maroon)}
.ansin:disabled{opacity:.7}
.why{margin-top:8px;padding-top:7px;border-top:1px dashed rgba(0,0,0,.18);font-size:13px;line-height:1.55;color:var(--ink-soft)}

.spk{border:0;background:var(--slate);border-radius:50%;width:46px;height:46px;cursor:pointer;margin-bottom:8px;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--gold);padding:0}
.spk svg{width:26px;height:26px;fill:none;stroke:#FBF1DC;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;color:var(--maroon-deep);text-decoration:underline;cursor:pointer;font-size:13px;font-family:inherit}
.hidden{display:none!important}
.sp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.spc{border:1.5px solid var(--gold);border-radius:12px;padding:6px 4px 9px;text-align:center;cursor:pointer;background:#fffdf6;font-size:12.5px;line-height:1.35}
.spc.on{border-color:var(--maroon);background:#f9efe7;box-shadow:0 0 0 1.5px var(--maroon)}
.spc .pv{height:150px;display:flex;align-items:flex-start;justify-content:center;background:linear-gradient(180deg,#EEF3F0,#DCE7E6);border-radius:8px;margin-bottom:6px;overflow:hidden}
.spc img{height:100%;width:auto;max-width:100%;object-fit:contain}
.foot{text-align:center;padding:18px 16px 16px}
.foot img{height:46px;width:auto;max-width:100%}
.foot .fct{font-size:12.5px;color:var(--ink-soft);margin:10px 0 4px}
@media(max-width:559px){body{padding:12px 10px 24px}.card{padding:22px 16px 18px}.strip{height:92px}.strip b{font-size:17px}.lv b{font-size:14px}}

/* banner đầu trang: nền Đôn Hoàng + tranh hoa + logo */
.hero{position:relative;height:230px;border:1.5px solid var(--gold);border-radius:14px;overflow:hidden;margin-bottom:16px;background:#f1d9bf center/cover no-repeat;box-shadow:0 8px 20px rgba(67,89,98,.18)}
.hero .tt{position:absolute;left:24px;top:50%;transform:translateY(-50%);max-width:58%}
.hero .tt img{height:54px;width:auto;display:block;margin-bottom:12px}
.hero .tt b{display:block;font-family:'Lora',serif;color:var(--slate);font-size:21px;letter-spacing:.02em}
.hero .tt small{display:block;color:var(--ink-soft);font-size:12.5px;margin-top:4px;letter-spacing:.04em}
.hero .fl{position:absolute;top:-6px;right:14px;height:112%;width:auto;filter:drop-shadow(0 4px 6px rgba(80,50,30,.22));transform-origin:50% 0;animation:sway2 10s ease-in-out infinite}
@keyframes sway2{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.4deg)}}
.hero.warm::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(252,243,228,.78) 0%,rgba(252,243,228,.4) 45%,rgba(252,243,228,0) 70%);pointer-events:none}
.hero.warm .tt{z-index:2}
.hero.cool::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(238,244,242,.8) 0%,rgba(238,244,242,.4) 45%,rgba(238,244,242,0) 70%);pointer-events:none}
.hero.cool .tt{z-index:2}
.card.warm{background:#FCF4E7;border-color:#CDAE7A}
.card.warm h2{color:var(--maroon-deep)}
.card.warm .tab.on{background:var(--maroon);color:#fff}
.card.warm .tab{background:#F4E6CF;color:var(--maroon-deep)}
.card.warm input{border-color:#CDAE7A}
.card.warm label{color:var(--maroon-deep)}
.card.warm .btn.alt{color:var(--maroon-deep);border-color:var(--maroon)}
.card.warm .note{color:#6B5640}
/* phóng toàn trang trên máy tính */
@media(min-width:1000px){.wrap{zoom:1.3}}
@media(min-width:1500px){.wrap{zoom:1.5}}
@media(max-width:559px){.hero{height:190px}.hero .tt{left:16px;max-width:60%}.hero .tt img{height:40px}.hero .tt b{font-size:17px}.hero .fl{right:-18px;height:100%}.hero .tt img{height:34px}:root{--vw:96px}.wrap{padding-right:52px}}
/* hai thẻ nhóm + lưới cấp độ */
.grp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gc{position:relative;display:block;width:100%;aspect-ratio:1.5/1;border:1.5px solid var(--gold);border-radius:14px;cursor:pointer;overflow:hidden;padding:0;text-align:left;font-family:inherit;background:#dfe8e6 center/cover no-repeat;transition:transform .15s,box-shadow .15s}
.gc:hover{transform:translateY(-2px)}
.gc .sc{position:absolute;inset:0;background:linear-gradient(0deg,rgba(38,54,61,.86) 0%,rgba(38,54,61,.35) 55%,rgba(38,54,61,0) 85%)}
.gc.q .sc{background:linear-gradient(0deg,rgba(90,40,28,.82) 0%,rgba(90,40,28,.3) 55%,rgba(90,40,28,0) 85%)}
.gc .tx{position:absolute;left:14px;right:14px;bottom:12px;color:#FBF6E9}
.gc b{display:block;font-family:'Lora',serif;font-size:20px;line-height:1.2}
.gc small{display:block;font-size:12px;margin-top:3px;color:#F0E6D0}
.gc .ar{position:absolute;right:12px;top:10px;width:26px;height:26px;border-radius:50%;background:rgba(251,246,233,.92);color:var(--maroon);display:flex;align-items:center;justify-content:center;font-size:14px;transition:transform .25s}
.gc.on{box-shadow:0 0 0 2.5px var(--maroon)}
.gc.on .ar{transform:rotate(180deg)}
.lvp{margin-top:14px;padding:14px;border:1px dashed var(--gold);border-radius:12px;background:#fffaf0}
.lvp h3{margin:0 0 10px;font-family:'Lora',serif;font-size:15px;color:var(--maroon-deep)}
@media(max-width:559px){
 .gc{aspect-ratio:1/1}.gc b{font-size:18px}
 .lvp .grid{grid-template-columns:1fr 1fr}
 .lvp .lv{aspect-ratio:1/1}
 .lvp .lv .tx{left:10px;right:10px;bottom:22px}
 .lvp .lv b{font-size:15px}
 .lvp .lv small{font-size:11px}
 .lvp .lv .sc{background:linear-gradient(0deg,rgba(38,54,61,.8) 0%,rgba(38,54,61,.3) 60%,rgba(38,54,61,0) 90%)}
 .lvp .lv.light .sc{background:linear-gradient(0deg,rgba(248,244,230,.92) 0%,rgba(248,244,230,.5) 60%,rgba(248,244,230,0) 90%)}
}
/* cuộn tranh ở đáy khung đăng nhập */
.scroll{display:block;width:calc(100% + 32px);margin:14px -16px -18px;mix-blend-mode:multiply;pointer-events:none}
.logohead{display:flex;align-items:center;gap:10px;margin-bottom:6px}.logohead img{height:40px;width:auto}
.logohead span{font-family:'Lora',serif;color:var(--slate);font-size:15px;letter-spacing:.03em}
.card.warm{overflow:hidden}
@media(max-width:559px){.logohead span{display:none}}
</style>

/* ====== Mật khẩu: băm SHA-256 trước khi gửi ====== */
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const mkHash=(u,p)=>sha(u.toLowerCase()+':'+p+':guangyu');

async function api(body){
  if(!API_URL){
    const users=JSON.parse(localStorage.getItem('gy_users')||'{}');
    const u=body.user;
    if(body.action==='register'){ if(users[u])return{ok:false,msg:'Tên này đã có người dùng'}; users[u]={h:body.hash,tree:body.tree,state:body.state||{}}; localStorage.setItem('gy_users',JSON.stringify(users)); return{ok:true,tree:body.tree,state:body.state||{}}}
    if(!users[u]||users[u].h!==body.hash) return{ok:false,msg:'Sai tên đăng nhập hoặc mã PIN'};
    if(body.action==='login') return{ok:true,tree:users[u].tree,state:users[u].state};
    if(body.action==='save'){users[u].state=body.state;localStorage.setItem('gy_users',JSON.stringify(users));return{ok:true}}
  }
  try{
    const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(body)});
    return await r.json();
  }catch(e){return{ok:false,msg:'Không kết nối được. Anh/chị/bạn kiểm tra mạng rồi thử lại nhé.'}}
}

/* ====== Phiên âm trên chữ Hán (bộ Giao tiếp) ====== */
let RUBY=false,PYM={};
const HANR=/[\u4e00-\u9fff〇]+/g;
function rb(t){
  t=String(t);let out='',last=0,m;HANR.lastIndex=0;
  while((m=HANR.exec(t))){
    out+=esc(t.slice(last,m.index));
    const run=m[0],sy=PYM[run];
    if(sy){const a=sy.split(' ');
      if(a.length==run.length){for(let i=0;i<run.length;i++)out+='<ruby>'+run[i]+'<rt>'+esc(a[i])+'</rt></ruby>'}
      else out+=esc(run)}
    else out+=esc(run);
    last=m.index+run.length;
  }
  return out+esc(t.slice(last));
}
const useRb=()=>RUBY&&!(CUR&&CUR.nopy);
const F=t=>useRb()?rb(t):fmt(t);

/* ====== Ẩn/hiện pinyin (các level giáo trình giao tiếp) ====== */
const TONE='āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ';
const hasHan=s=>/[\u4e00-\u9fff]/.test(s);
const hasTone=s=>new RegExp('['+TONE+']').test(s);
const isPyLine=s=>hasTone(s)&&new RegExp("^[a-züÜ"+TONE+"\\s'’,.?!，。？！；;:：·-]+$","i").test(s.trim());
function fmt(t){
  const lines=String(t).split('\n'),multi=lines.length>1;
  return lines.map((ln,i)=>{
    const nl=i<lines.length-1?'\n':'';const e=esc(ln);
    if(multi&&!hasHan(ln)&&isPyLine(ln)) return '<span class="py">'+e+nl+'</span>';
    return e.replace(/[(（][^()（）\u4e00-\u9fff]*[)）]/g,m=>isPyLine(m.slice(1,-1))?'<span class="py">'+m+'</span>':m)+nl;
  }).join('');
}
function pyOn(){try{return localStorage.getItem('gy_nopy')!=='1'}catch(e){return true}}

  if(!pool.length){
    $('#app').innerHTML=`<div class="card"><h2>Chúc mừng!</h2><p>Bạn đã làm hết bộ đề này. Quay lại chọn level khác để cây lớn thêm nhé.</p><button class="btn" onclick="screenLevels()">Chọn level khác</button></div>`;return}

/* ====== Câu gõ đáp án ====== */
const NP=/[\s，。！？、；：“”‘’"'（）()…·—\-~,.!?;:《》「」『』【】\[\]]/g;
const nh=t=>String(t).normalize('NFKC').replace(NP,'').toLowerCase();
const parts=t=>[...new Set(String(t).split(/[；;，,、\s]+/).map(nh).filter(Boolean))].sort().join('|');
function judgeType(q,v){
  if(q.kind=='digits') return v.normalize('NFKC').replace(/\D/g,'')==q.a;
  if(q.kind=='letters') return v.toUpperCase().replace(/[^A-F]/g,'')==q.a;
  if(q.kind=='set') return parts(v)==parts(q.a);
  return [q.a].concat(q.alts||[]).some(x=>nh(x)==nh(v));
}
function chkType(){
  const q=CUR,el=$('#ans');if(!el||el.disabled)return;
  const v=el.value;if(!v.trim())return;
  el.disabled=true;$('#chk').classList.add('hidden');
  const ok=judgeType(q,v);
  const ref='Đáp án: '+(q.kind=='letters'?q.a.split('').join(' – ')+(q.exp?'\n'+q.exp.replace(/^Thứ tự đúng:[^\n]*\n?/,''):''):(q.exp||q.a));
  if(ok||!(q.lenient||q.kind=='set')){ result(ok,ok?'\n'+ref:ref); return }
  // câu dài: có thể đúng nhưng khác đáp án mẫu -> cho Thầy/học viên tự chấm
  const fb=$('#fb');fb.className='fb info';
  fb.innerHTML=F('Chưa khớp với đáp án mẫu.\nBạn gõ: ')+esc(v)+F('\n'+ref+'\n\nNếu câu của bạn cũng đúng ngữ pháp và đúng nghĩa thì bấm "Tính là đúng".')+(q.why?'<div class="why">'+esc(q.why)+'</div>':'')
   +'<div class="row" style="margin-top:10px"><button class="btn small main" onclick="selfJudge(true)">Tính là đúng</button><button class="btn small alt" onclick="selfJudge(false)">Tính là sai</button></div>';
}
function selfJudge(r){const q=CUR;result(r,r?'\nĐáp án mẫu: '+(q.exp||q.a):'\nĐáp án mẫu: '+(q.exp||q.a))}
function revealShow(){
  const q=CUR;$('#rev').classList.add('hidden');
  const fb=$('#fb');fb.className='fb info';
  fb.innerHTML=q.ans?F('Đáp án mẫu:\n'+q.ans+'\n\nBạn tự đối chiếu, câu này không tính điểm.'):'Câu này là câu mở, không có đáp án cố định. Bạn tự đánh giá, câu này không tính điểm.';
  $('#nx').classList.remove('hidden');
}
function afterQ(){
  if(CUR.type=='show'){mark(curLevel,CUR.n,true);scheduleSave()}
  nextQ();
}

/* ====== Nghe (giọng Safari) ====== */
function zhVoice(){const v=speechSynthesis.getVoices().filter(x=>/^zh/i.test(x.lang));return v[0]||null}
function speak(){
  if(!('speechSynthesis' in window)){alert('Thiết bị này chưa hỗ trợ đọc tiếng Trung.');return}
  speechSynthesis.cancel();
  const turns=CUR.audio;const voice=zhVoice();
  turns.forEach(([w,t])=>{
    const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';if(voice)u.voice=voice;u.rate=.85;u.pitch=w=='m'?0.8:(w=='f'?1.25:1);
    speechSynthesis.speak(u);
  });
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};
